<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="TalentHub México — Bolsa de trabajo para el sector de TI en México">
  <defs>
    <radialGradient id="glow" cx="24%" cy="14%" r="78%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="46%" stop-color="#ffffff" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ultramar" cx="92%" cy="95%" r="90%">
      <stop offset="0%" stop-color="#3355ff" stop-opacity="0.20"/>
      <stop offset="40%" stop-color="#3355ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3355ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3355ff" stop-opacity="0"/>
      <stop offset="22%" stop-color="#3355ff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#9db0ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9db0ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#0a0a0a"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect width="1200" height="300" fill="url(#ultramar)"/>

  <g font-family="'DM Sans','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="82" y="92" fill="#8a8a8a" font-size="14" letter-spacing="3" font-weight="500">
      EMPLEO TECNOLÓGICO EN MÉXICO
    </text>

    <!-- Un solo <text> con tspan: el color cambia sin posicionar a mano,
         así no se desalinea cuando la fuente cae a la del sistema. -->
    <text x="80" y="176" fill="#ededed" font-size="72" font-weight="500" letter-spacing="-2.4">
      TalentHub<tspan fill="#9db0ff" dx="24">México</tspan>
    </text>

    <text x="82" y="222" fill="#c2c2c2" font-size="18">
      Vacantes verificadas, con el rango salarial a la vista desde el primer día.
    </text>

    <text x="82" y="266" fill="#6f6f6f" font-size="13" letter-spacing="1.6">
      REACT · TYPESCRIPT · DJANGO · POSTGRESQL
    </text>
  </g>

  <rect x="0" y="296" width="1200" height="4" fill="url(#hairline)"/>
</svg>
